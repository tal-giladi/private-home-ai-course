- id: q1
  question: >-
    Why does a public benchmark rank models poorly at predicting which one suits a home assistant?
  options:
    - Benchmarks are updated so often that any score printed in a lesson is out of date within weeks.
    - Benchmarks run on hardware far faster than a CPU-only machine, so their ordering does not hold.
    - Benchmarks measure average performance on general tasks, not the specific repeated work a household does.
    - Benchmarks score models before quantisation, so the ranking excludes the format actually used at home.
  correct: 2
  explanation: >-
    A benchmark reports an average over tasks chosen by its authors. A household repeats a narrow
    set of tasks — the same kinds of documents, the same kinds of commands — and the model that
    wins on average frequently loses on those. Twenty of your own tasks is the only comparison that
    answers the question you actually have.

- id: q2
  question: >-
    You ask three models to explain a washing machine error code. One answers fluently, in
    confident prose, with the wrong procedure — something it clearly knows from training. How should
    your eval set score it?
  options:
    - A fail, but only if the incorrect procedure could damage the machine or the user.
    - A pass, because the answer was correct-sounding and free of hedging.
    - A pass, because the model clearly had relevant knowledge about the appliance.
    - A fail, because the pass condition is about the procedure in the document, not about fluency.
  correct: 3
  explanation: >-
    Retrieval-augmented work is judged on whether the answer is supported by the source. Fluency
    from training data is exactly the failure mode you are building the stack to avoid, so the pass
    condition must name the procedure from the document rather than reward a well-written answer.

- id: q3
  question: >-
    Your twenty-task eval gives the fastest model 16 passes and the slowest 19. The voice pipeline
    has a three-second budget per command. What is the defensible choice?
  options:
    - Take the 16, because a command that arrives late is a command the household stops using.
    - Take whichever wins on the action tasks only, since the other tasks do not involve commands.
    - Take neither, and run both, because a model swap between them costs under a second.
    - Take the 19, because three extra passes outweigh any latency difference on a home network.
  correct: 0
  explanation: >-
    The eval set measures quality and speed separately, and a voice assistant is judged on both at
    once. A tool call that reliably arrives after the user has already given up is not a success
    even if the action was right, which is why the trade-off has to be made explicitly and written
    down rather than settled by the quality column.

- id: q4
  question: >-
    You re-run the same twenty tasks a week later and three scores have changed, with the model and
    the settings held constant. What is the most likely cause?
  options:
    - The model weights were updated by a background download in the model server.
    - Temperature was not fixed at zero, or the model is not deterministic between runs.
    - The documents were re-indexed, so retrieval returned different chunks for the same task.
    - The machine was less loaded, so the answers were generated with more context available.
  correct: 1
  explanation: >-
    Sampling above temperature zero makes each run a different sample, and small models are
    especially variable near the edge of their ability. Fixing the setting at zero and scoring all
    tasks in one sitting is what makes the comparison mean anything.
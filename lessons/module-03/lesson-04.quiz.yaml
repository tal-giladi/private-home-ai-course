- id: q1
  question: >-
    A model server is set with `OLLAMA_KEEP_ALIVE: -1` on a 16 GB machine. Two models are used
    once each and then nothing happens for a day. What is the state of the box?
  options:
    - Both models were unloaded, because a negative value is treated as an invalid setting.
    - The smaller model stayed and the larger one unloaded, because only one fits.
    - The models unloaded after the default timeout, since -1 applies only to the container itself.
    - Both models are still in RAM, because -1 means never unload.
  correct: 3
  explanation: >-
    A keep-alive of `-1` means the model stays resident indefinitely. On a 16 GB machine that is
    several gigabytes held for services nobody is using, and the symptom is not a crash but
    everything else on the box becoming slow.

- id: q2
  question: >-
    Which change most reliably prevents a long-running container from filling the disk with logs?
  options:
    - Setting a `logging` block with `max-size` and `max-file` so old log files are rotated away.
    - Running `docker logs --tail=50` regularly, which trims the file it reads from.
    - Adding a health check, which restarts the container whenever its output grows.
    - Mounting the container's log directory as a volume so the files persist between restarts.
  correct: 0
  explanation: >-
    Container logs grow without a bound unless you say otherwise. The Compose `logging` block caps
    each file and the number kept, after which the oldest is rotated away automatically. Reading
    logs never truncates them, and a volume would preserve them rather than limit them.

- id: q3
  question: >-
    You run `docker compose down` to stop the stack and the models, chat history and Home Assistant
    database all survive. Why?
  options:
    - Compose copies container state into a backup volume before shutting down.
    - "`down` only removes containers and networks, and named volumes are deliberately left in place."
    - The images themselves carry the data, so recreating containers restores it.
    - The data is written to the host filesystem rather than to volumes, so it is untouched.
  correct: 1
  explanation: >-
    `down` removes containers and networks and leaves named volumes alone, which is what makes it
    the safe way to stop a stack. Adding `-v` deletes the volumes and with them everything in them,
    which is why that flag is worth treating as a data-deletion command.

- id: q4
  question: >-
    Two requests arrive at the same time on a CPU-only box. The second reply is noticeably slower
    than it would have been alone. What is the most direct cause?
  options:
    - Context length is capped, so the second request was truncated to fit the space the first left.
    - The first request filled the model's KV cache, so the second had to rebuild it from scratch.
    - The two requests share one memory bandwidth, so each gets roughly half of it.
    - The model server serialises writes to the model volume, so the second request waits on disk.
  correct: 2
  explanation: >-
    Generation is bandwidth-bound, and two concurrent requests divide the same bytes per second
    rather than getting more of them. This is why the course's stack sets
    `OLLAMA_NUM_PARALLEL: 1`: queueing a request is better than halving the speed of both.

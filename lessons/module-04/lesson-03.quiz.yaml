- id: q1
  question: >-
    A chat interface has automatic conversation titling enabled. Each time you start a new chat,
    something is sent to a third party. What exactly?
  options:
    - Only a hash of the conversation, so the provider cannot read what you wrote.
    - The whole conversation, so the model has enough context to summarise it accurately.
    - Nothing; title generation runs on the local model, because every model call is local.
    - The first message of the conversation, so the model can propose a short title for it.
  correct: 3
  explanation: >-
    Automatic titling is a model call made on your behalf for a cosmetic reason, and if the
    interface is configured with a hosted provider, your first message goes to that provider. It is
    the clearest example of a feature that is free and optional and still a data leak.

- id: q2
  question: >-
    Which of these is the most reliable way to check that a local chat interface is not talking to
    anything but your own machine?
  options:
    - Watching the browser's network tab and confirming every request goes to your own address.
    - Checking that the container's environment file contains no API keys.
    - Disabling the model server and confirming the interface stops working.
    - Reading the project's documentation and confirming the features are described as local.
  correct: 0
  explanation: >-
    Documentation describes intentions and the absence of a key says nothing about a call made on
    your behalf. The network tab shows what actually happened, from the browser's side, which is the
    only place a fetch can be observed reliably.

- id: q3
  question: >-
    Sign-up is left open on a chat interface published to your LAN address. What risk does that
    create specifically?
  options:
    - The chat interface will fall back to hosting its own model in the browser.
    - Any device on the network can create an account and use the interface, which proxies to your model server.
    - The interface will run out of accounts and stop accepting model calls.
    - The model server's memory limit will be raised to accommodate the extra accounts.
  correct: 1
  explanation: >-
    Authentication with open registration is not much of a control: anyone on the network,
    including a device on guest Wi-Fi, can create an account and use your machine's compute. The
    interface is a proxy to the model server, so account access is effectively server access.

- id: q4
  question: >-
    A user pastes a web address into a chat and asks the model to summarise the page. The summary
    comes back. What left the machine?
  options:
    - Nothing, because the local model can read a URL on its own.
    - Only the URL, since the page content is fetched and summarised locally.
    - The URL and the page content, fetched by the interface's page loader on your behalf.
    - The whole conversation, because a page fetch requires the full context.
  correct: 2
  explanation: >-
    The local model cannot fetch anything; the interface does it, and that request goes to the
    remote site with your IP address. It is a small, easily missed leak, and the fix is to turn the
    page loader off unless you specifically want it.

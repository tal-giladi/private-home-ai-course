- id: q1
  question: >-
    What does a dedicated voice satellite change about a home assistant that already works?
  options:
    - Availability and placement, and nothing about how well the assistant decides.
    - The model's tool-calling reliability, because the audio arrives more cleanly.
    - Latency, because dedicated hardware does not share a CPU with other services.
    - Transcription accuracy, because its microphone matches the speech model better.
  correct: 0
  explanation: >-
    A satellite buys a wake word detector that runs on a chip and a microphone in a different room.
    The speech model and the conversation agent still live on your box, and neither is improved by a
    cheaper microphone, so if those are your weak link the purchase changes nothing.

- id: q2
  question: >-
    You train a custom wake word model on two hours of your voice in a quiet room, and it then
    ignores you in the kitchen. What went wrong?
  options:
    - Custom models only work within a few metres of where the audio was recorded.
    - The training included no background noise, so the model learned that noise means silence.
    - The service kept serving the previous model and the new one never took effect.
    - Two hours is not enough audio for the model to learn your voice at all.
  correct: 1
  explanation: >-
    The negatives are the training. A model that has never heard an extractor fan treats its
    spectral signature as background, so it will not fire in that room. It reads as a recogniser
    problem and is really a data-collection problem.

- id: q3
  question: >-
    Which measurement would tell you most whether dedicated hardware would improve your setup?
  options:
    - The generation speed of your chat model, since it sets the rate of spoken replies.
    - The count of entities exposed to Assist, which determines how many rooms need a device.
    - The false-accept rate of your wake word, measured over an hour in three rooms.
    - The number of audio samples used in your wake word training set.
  correct: 2
  explanation: >-
    False accepts are what hardware wake word detection genuinely improves, and measuring per room
    tells you whether the problem is your model, your room or the microphone's position. Generation
    speed and entity count are worth knowing and are not changed by a device that costs $69.

- id: q4
  question: >-
    Why does this course never make dedicated voice hardware a requirement for any lab or capstone
    criterion?
  options:
    - Hardware satellites cannot reach a model server running inside a container.
    - The course could not verify pricing or availability for any consumer device.
    - Dedicated satellites are not supported by Home Assistant's Wyoming protocol.
    - Every voice lab is completable by typed input or WAV files, so requiring hardware would exclude people.
  correct: 3
  explanation: >-
    Every voice lab works from typed input or recorded files, and the capstone accepts a typed
    pipeline plus a text-to-speech output check. Making a purchase necessary would exclude anyone
    without a spare £69 and would test their budget rather than their understanding.
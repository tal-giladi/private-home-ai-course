<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">The private home AI stack on one machine</title>
  <desc id="d">One home computer with 16 to 32 gigabytes of RAM running a model server, a chat interface, a vector store over personal files, and a Home Assistant instance, all on an internal Docker network. Only the chat interface is published to the local network, and nothing is published to the internet.</desc>

  <rect x="0" y="0" width="760" height="470" fill="#fbfbfd"/>
  <text x="24" y="32" font-size="18" font-weight="600" fill="#16181d">One machine, one RAM budget</text>
  <text x="24" y="52" font-size="13" fill="#5b6270">Everything below shares the same 16–32 GB. That is why sizing comes before building.</text>

  <rect x="24" y="72" width="712" height="300" rx="14" fill="#ffffff" stroke="#3b4252" stroke-width="2"/>
  <text x="40" y="96" font-size="12" font-weight="600" fill="#3b4252">YOUR COMPUTER</text>

  <rect x="44" y="112" width="326" height="150" rx="10" fill="#eef4ff" stroke="#2f5fd0" stroke-width="1.5"/>
  <text x="60" y="134" font-size="13" font-weight="600" fill="#1d3f8f">Internal Docker network</text>
  <text x="60" y="150" font-size="11" fill="#41507a">not published to the host at all</text>

  <rect x="60" y="162" width="138" height="42" rx="7" fill="#ffffff" stroke="#2f5fd0"/>
  <text x="72" y="180" font-size="12" font-weight="600" fill="#16181d">Model server</text>
  <text x="72" y="195" font-size="10" fill="#5b6270">Ollama</text>

  <rect x="212" y="162" width="142" height="42" rx="7" fill="#ffffff" stroke="#2f5fd0"/>
  <text x="224" y="180" font-size="12" font-weight="600" fill="#16181d">Vector store</text>
  <text x="224" y="195" font-size="10" fill="#5b6270">optional · Module 6</text>

  <rect x="60" y="212" width="138" height="38" rx="7" fill="#ffffff" stroke="#2f5fd0"/>
  <text x="72" y="236" font-size="12" fill="#16181d">Your own files</text>

  <rect x="212" y="212" width="142" height="38" rx="7" fill="#ffffff" stroke="#2f5fd0"/>
  <text x="224" y="236" font-size="12" fill="#16181d">Home Assistant</text>

  <rect x="392" y="112" width="324" height="150" rx="10" fill="#fff6ec" stroke="#c9741a" stroke-width="1.5"/>
  <text x="408" y="134" font-size="13" font-weight="600" fill="#8a4a08">Voice services (profile: voice)</text>
  <text x="408" y="150" font-size="11" fill="#7a5a33">wake word · STT · intent · LLM · TTS</text>

  <rect x="408" y="162" width="98" height="38" rx="7" fill="#ffffff" stroke="#c9741a"/>
  <text x="418" y="186" font-size="12" fill="#16181d">Satellite</text>

  <rect x="516" y="162" width="90" height="38" rx="7" fill="#ffffff" stroke="#c9741a"/>
  <text x="526" y="186" font-size="12" fill="#16181d">Whisper</text>

  <rect x="616" y="162" width="90" height="38" rx="7" fill="#ffffff" stroke="#c9741a"/>
  <text x="626" y="186" font-size="12" fill="#16181d">Piper</text>

  <rect x="408" y="212" width="298" height="38" rx="7" fill="#ffffff" stroke="#c9741a"/>
  <text x="420" y="236" font-size="12" fill="#16181d">Wired to the model server and to Home Assistant</text>

  <rect x="44" y="278" width="672" height="78" rx="10" fill="#f2f6f2" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="60" y="300" font-size="13" font-weight="600" fill="#1d5c38">Published to your local network</text>
  <text x="60" y="320" font-size="12" fill="#2b3b31">Chat interface on one port, with a real account, and only after Module 11 explains the cost.</text>
  <text x="60" y="340" font-size="11" fill="#41564a">The model server is never published. Neither is anything on the voice network.</text>

  <rect x="24" y="392" width="712" height="58" rx="12" fill="#fdeeee" stroke="#b3271e" stroke-width="1.5"/>
  <text x="44" y="416" font-size="13" font-weight="600" fill="#8c1d16">The internet</text>
  <text x="44" y="436" font-size="12" fill="#6d2a25">Reached only to download software and models, once. Remote access later goes over a VPN, never a port forward.</text>

  <text x="24" y="466" font-size="11" fill="#8b8f9a">Drawn for Module 0. Ports and names are the ones labs/common/compose.yaml actually uses.</text>
</svg>

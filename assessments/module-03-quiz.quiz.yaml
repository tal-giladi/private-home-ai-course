- id: q1
  question: >-
    You have a 32 GB desktop with one 16 GB DDR5-6000 stick in one slot, and a 4B model that runs at
    7 tokens/second. You add a second matching stick in the correct slot. What should you expect?
  options:
    - Generation speed roughly doubles, because the memory bus width doubles with the second channel.
    - Generation speed roughly doubles, because the total amount of memory doubles with the second stick.
    - Generation speed stays about the same, because the model never used more than one channel.
    - Prompt speed doubles while generation speed is unchanged, because only prompt work is memory-bound.
  correct: 0
  explanation: >-
    A single DIMM leaves one memory channel unpopulated, so the CPU can pull roughly half as many
    bytes per second. Every generated token re-reads the whole model, so generation speed follows
    bandwidth almost directly — which makes a matching second stick the best-value upgrade in this
    course.

- id: q2
  question: >-
    A colleague sends you their `compose.yaml` with `ports: - "11434:11434"` on the model server so
    that "the UI can reach it more easily". What is the actual effect on your network?
  options:
    - None, because the chat interface already resolves the service name on the internal network.
    - The model server's unauthenticated API becomes reachable from every device on your LAN.
    - The model server becomes reachable from the internet, because Compose publishes on all interfaces.
    - Only the loopback interface is opened, because Compose adds a local firewall rule automatically.
  correct: 1
  explanation: >-
    A published port with no bind address listens on every interface the host has, which includes
    the one your router can reach, and the Ollama API has no authentication at all. The UI does not
    need it: on an internal network it reaches the model server by service name, with no port
    published anywhere.

- id: q3
  question: >-
    Your laptop has 16 GB of RAM and 284 GB free on disk. You want the full course working at
    once: a 4B chat model, a vector store, Home Assistant, Whisper, Piper and a browser. What does
    the RAM bill suggest?
  options:
    - It fits, because Docker shares one memory pool across all the containers.
    - It fits, because the model is only 2.5 GB and everything else is small.
    - It does not fit comfortably, so the memory limits in .env need lowering and the model may need to be smaller.
    - It fits, provided the disk is fast enough to page models in and out of memory.
  correct: 2
  explanation: >-
    The bill is weights plus KV cache plus runtime overhead plus everything else on the box, and the
    defaults in the course's `.env` add up to more than 16 GB once the browser and the operating
    system are counted. Lowering the per-service limits and keeping a 3–4B model is the fix, and it
    is why Module 2 comes before Module 3.

- id: q4
  question: >-
    You followed the module and pulled `qwen3:4b` on the host with a native Ollama install. The
    Compose stack is running, and the chat interface says there are no models available. What is
    the shortest correct fix?
  options:
    - Delete the host installation, because two Ollama instances on one machine always conflict.
    - Change `OLLAMA_BASE_URL` to point at `http://127.0.0.1:11434` on the host.
    - "Add `ports: - \"11434:11434\"` to the model server so both installs share one model store."
    - Pull the model into the stack's volume with a throwaway container on Docker's default bridge.
  correct: 3
  explanation: >-
    The host's store and the container's volume are different directories, so the model the host
    downloaded is not visible to the stack. A `--rm` container with the volume attached and the
    default bridge downloads it in one step and then disappears, which keeps the long-running model
    server with no route to the internet at all.

- id: q5
  question: >-
    `docker compose up -d` finishes, but a service you added for the next module never appears in
    `docker compose ps`. Nothing is failing. What explains it?
  options:
    - The service belongs to a profile that was not passed on the command line.
    - The service has no health check, so Compose skips it during `up`.
    - The service is on the internal network, which is not created until the first request.
    - The service is defined after the profiles section, so Compose does not read it.
  correct: 0
  explanation: >-
    A service in a profile is opt-in: Compose starts it only when you pass that profile, such as
    `docker compose --profile voice up -d`. This is the most common confusing thing about Compose
    and it is a design choice, not a fault.

- id: q6
  question: >-
    Three months in, `docker system df` shows 41 GB of images, 6 GB of volumes and a single log file
    of 2.8 GB in a container that has no rotation configured. What is the correct order of action?
  options:
    - Remove the model volumes, then re-pull only the model you actually use.
    - Prune dangling images, add a logging block with max-size, and leave the volumes alone.
    - Run `docker compose down -v` and `up -d`, which is the standard way to reclaim everything.
    - Prune volumes first, because volumes are the largest and safest to remove.
  correct: 1
  explanation: >-
    Old images and unbounded logs are pure waste and safe to reclaim. Volumes hold your models, chat
    history and the Home Assistant database, and `down -v` deletes all of it at once with no
    confirmation, so it is the last option rather than a cleanup habit.

- id: q7
  question: >-
    You are choosing between a Raspberry Pi 5 and an Intel N100 mini PC for a stack that must be
    always-on. The Pi is silent and cheap; the N100 has a fan and costs more. Which single
    consideration most favours the N100?
  options:
    - Its gigabit Ethernet port, which the Pi's does not have.
    - Its support for Docker images, which the Pi's architecture does not provide.
    - Its memory bandwidth, which is roughly double, and therefore its generation speed for the same model.
    - Its lower idle power draw, which is typically about half the Pi's.
  correct: 2
  explanation: >-
    Generation speed is bandwidth divided by model size, and the N100 moves roughly 25–30 GB/s
    against the Pi 5's ~17 GB/s. That is the difference between a usable chat model and a 1B model
    that only just keeps up, and it is worth more than the fan noise.

- id: q8
  question: >-
    A container is killed mid-request with no error in its own logs. The compose file sets
    `memory: 3g` for that service and `docker inspect` reports exit code 137. What does that mean?
  options:
    - A health check failed repeatedly, so Compose shut the container down.
    - The internal network dropped, so the container lost its only route to the other services.
    - The image was corrupted, so the runtime could not load it.
    - The service was killed by the out-of-memory mechanism for exceeding its limit.
  correct: 3
  explanation: >-
    Exit code 137 is the standard signal for a process killed from outside — almost always the
    out-of-memory killer acting on a container that exceeded its limit. The application never runs
    its own error handling, which is why there is nothing in the log; the fix is a higher limit or
    a smaller model.

- id: q9
  question: >-
    You want your phone to reach the chat interface when you are at home. The interface currently
    binds to `127.0.0.1`. What is the minimum change, and what is the reason to hesitate?
  options:
    - Change the bind address to the LAN address, and hesitate because the interface would then be reachable by every device on the Wi-Fi.
    - Add a second port mapping with the same container port, and hesitate because Docker cannot bind two addresses to one container.
    - Set `WEBUI_AUTH` to False so the phone can sign in easily, and hesitate because accounts would be skipped.
    - Add the phone's IP to the internal network definition, and hesitate because internal networks have no DHCP.
  correct: 0
  explanation: >-
    Publishing on the LAN address is the minimal change, and it is a real decision: every device on
    your Wi-Fi can then reach a web interface that holds your chat history. Module 11 is about doing
    this properly — with authentication confirmed, over a VPN, or not at all — and the capstone
    requires a written decision either way.
